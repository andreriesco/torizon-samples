services:
  clvgl-ha-test-debug:
    build:
      context: .
      dockerfile: Dockerfile.debug
    image: ${LOCAL_REGISTRY}:5002/clvgl-ha-test-debug:${TAG}
    ports:
      - ${DEBUG_SSH_PORT}:${DEBUG_SSH_PORT}
    device_cgroup_rules:
            # Add device access rights through cgroup
      - "c 4:* rmw"       # For tty
      - "c 13:* rmw"       # For /dev/input devices
      - "c 226:* rmw"       # For /dev/dri devices
      - "c 199:* rmw"
      - "c 29:* rmw"       # For /dev/fb0
    volumes:
      - type: bind
        source: /dev
        target: /dev
    profiles:
      - debug

  clvgl-ha-test:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKER_LOGIN}/clvgl-ha-test:${TAG}
    device_cgroup_rules:
            # Add device access rights through cgroup
            # For tty
      - "c 4:* rmw"
            # For /dev/input devices
      - "c 13:* rmw"
            # For /dev/dri devices
      - "c 226:* rmw"
      - "c 199:* rmw"
              # For /dev/fb0
      - "c 29:* rmw"
    volumes:
      - type: bind
        source: /dev
        target: /dev
    profiles:
      - release
